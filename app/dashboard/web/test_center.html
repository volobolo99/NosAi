<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NosAi — Test Center</title><style>body{margin:0;background:#050912;color:#edf6ff;font:13px system-ui}main{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#849ab2}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.card{background:#0b1422;border:1px solid #1d3048;border-radius:12px;padding:14px}.gate{font-weight:800}.PASS{color:#4be19a}.FAIL{color:#ff657d}.WARN{color:#ffd166}.NOT_RUN{color:#849ab2}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #172a40;font-size:11px}input{width:100%;padding:9px;background:#08111d;border:1px solid #1d3048;border-radius:8px;color:#fff;margin:12px 0;box-sizing:border-box}details{background:#08111d;border:1px solid #172a40;border-radius:8px;padding:8px;margin-top:8px}pre{white-space:pre-wrap;overflow:auto;color:#9ab0c6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="top"><div><h1>Test & Verification Center</h1><div class="muted">Scansione AST, contratti, comunicazioni, dimensioni e gate. Aggiornamento automatico.</div></div><a href="/">← Dashboard</a></div><section id="gates" class="grid"></section><section class="card" style="margin-top:14px"><b>Riepilogo</b><div id="summary" class="muted"></div><input id="filter" placeholder="Filtra file, simbolo, test o import..."></section><section class="card"><b>File / simboli / test / comunicazioni</b><div id="files"></div></section><section class="card" style="margin-top:14px"><b>Grafo comunicazioni</b><div id="edges"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data;function render(){const g=document.getElementById('gates');g.innerHTML=Object.entries(data.gates).map(([k,v])=>`<div class="card"><div>${k}</div><div class="gate ${v}">${v}</div></div>`).join('');document.getElementById('summary').textContent=Object.entries(data.summary).map(([k,v])=>`${k}: ${v}`).join(' · ');drawFiles();document.getElementById('edges').innerHTML=data.communications.slice(0,500).map(e=>`<div>${esc(e.from)} → ${esc(e.to)} <span class="muted">${e.kind}</span></div>`).join('')||'<span class="muted">Nessun collegamento rilevato</span>'}function drawFiles(){const q=document.getElementById('filter').value.toLowerCase();const rows=data.files.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('files').innerHTML=rows.map(r=>`<details><summary><b>${esc(r.path)}</b> · ${r.lines} LOC · ${r.bytes} B · <span class="${r.parse}">${r.parse}</span></summary><div class="muted">module: ${esc(r.module)} · imports: ${r.imports.length} · calls: ${r.calls.length} · tests: ${r.tests.length}</div><div>Symbols: ${r.symbols.map(s=>`${esc(s.name)}:${s.line}`).join(', ')||'—'}</div><div>Tests: ${r.tests.map(esc).join(', ')||'—'}</div><div>Imports: ${r.imports.map(esc).join(', ')||'—'}</div>${r.error?`<pre>${esc(r.error)}</pre>`:''}</details>`).join('')||'<span class="muted">Nessun risultato</span>'}async function refresh(){const r=await fetch('/api/test-center',{cache:'no-store'});data=await r.json();render()}document.getElementById('filter').oninput=drawFiles;refresh();setInterval(refresh,10000)</script></body></html>
