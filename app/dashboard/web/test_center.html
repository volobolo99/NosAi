<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NosAi — Test Center</title><style>body{margin:0;background:#050912;color:#edf6ff;font:13px system-ui}main{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#849ab2}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.card{background:#0b1422;border:1px solid #1d3048;border-radius:12px;padding:14px}.gate{font-weight:800}.PASS{color:#4be19a}.FAIL{color:#ff657d}.WARN{color:#ffd166}.NOT_RUN{color:#849ab2}input{width:100%;padding:9px;background:#08111d;border:1px solid #1d3048;border-radius:8px;color:#fff;margin:12px 0;box-sizing:border-box}details{background:#08111d;border:1px solid #172a40;border-radius:8px;padding:8px;margin-top:8px}pre{white-space:pre-wrap;overflow:auto;color:#9ab0c6}.flag{display:inline-block;padding:2px 6px;border-radius:8px;background:#2c2512;color:#ffd166;margin:2px}@media(max-width:900px){.grid,.egrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="top"><div><h1>Test & Verification Center</h1><div class="muted">AST, CI, JUnit, coverage, contratti, comunicazioni, dimensioni e gate.</div></div><a href="/">← Dashboard</a></div><section id="gates" class="grid"></section><section class="card" style="margin-top:14px"><b>Evidence CI</b><div id="evidence" class="egrid"></div><div id="cierror" class="muted"></div></section><section class="card" style="margin-top:14px"><b>Riepilogo</b><div id="summary" class="muted"></div><input id="filter" placeholder="Filtra file, simbolo, test o import..."></section><section class="card"><b>File / simboli / test / peso</b><div id="files"></div></section><section class="card" style="margin-top:14px"><b>Grafo comunicazioni</b><div id="edges"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data;function card(k,v){return `<div class="card"><div class="muted">${esc(k)}</div><b class="${esc(v)}">${esc(v)}</b></div>`}function render(){document.getElementById('gates').innerHTML=Object.entries(data.gates).map(([k,v])=>card(k,v)).join('');const j=data.junit||{},c=data.coverage||{},ci=data.ci||{};document.getElementById('evidence').innerHTML=[card('CI',ci.status||'NOT_RUN'),card('JUnit',j.status||'NOT_RUN'),card('Tests',j.tests??'—'),card('Failures',j.failures??'—'),card('Skipped',j.skipped??'—'),card('Duration',j.duration??'—'),card('Line coverage',c.line_percent!=null?c.line_percent+'%':'NOT_RUN'),card('Branch coverage',c.branch_percent!=null?c.branch_percent+'%':'NOT_RUN')].join('');document.getElementById('cierror').textContent=ci.error||j.error||c.error||'';document.getElementById('summary').textContent=Object.entries(data.summary).map(([k,v])=>`${k}: ${v}`).join(' · ');drawFiles();document.getElementById('edges').innerHTML=data.communications.slice(0,500).map(e=>`<div>${esc(e.from)} → ${esc(e.to)} <span class="muted">${esc(e.kind)}</span></div>`).join('')||'<span class="muted">Nessun collegamento rilevato</span>'}function drawFiles(){const q=document.getElementById('filter').value.toLowerCase();const rows=data.files.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('files').innerHTML=rows.map(r=>`<details><summary><b>${esc(r.path)}</b> · ${r.lines} LOC · ${r.bytes} B · <span class="${r.parse}">${r.parse}</span></summary><div class="muted">module: ${esc(r.module)} · imports: ${r.imports.length} · calls: ${r.calls.length} · assertions: ${r.assertions} · tests: ${r.tests.length}</div><div>${r.weight_flags.map(f=>`<span class="flag">${f}</span>`).join('')||'<span class="muted">peso OK</span>'}</div><div>Symbols: ${r.symbols.map(s=>`${esc(s.name)}:${s.line}`).join(', ')||'—'}</div><div>Tests: ${r.tests.map(esc).join(', ')||'—'}</div><div>Imports: ${r.imports.map(esc).join(', ')||'—'}</div>${r.error?`<pre>${esc(r.error)}</pre>`:''}</details>`).join('')||'<span class="muted">Nessun risultato</span>'}async function refresh(){try{const r=await fetch('/api/test-center',{cache:'no-store'});data=await r.json();render()}catch(e){document.getElementById('summary').textContent='Test Center non raggiungibile: '+e}}document.getElementById('filter').oninput=drawFiles;refresh();setInterval(refresh,10000)</script></body></html>
