[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nos-ai-project"
version = "4.19.2"
description = "NosAi full-runtime fusion project"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
]

[project.optional-dependencies]
m1-learning = ["torch>=2.0"]
windows-perception = [
  "dxcam>=0.0.5",
  "numpy>=1.26,<3",
  "psutil>=5.9",
]
test = [
  "pytest>=8,<9",
  "torch>=2.0",
  "numpy>=1.26,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "torch>=2.0",
  "numpy>=1.26,<3",
  "openai>=1.0",
  "psutil>=5.9",
]

[project.scripts]
nosai-preflight = "app.preflight:main"
nosai-pilot = "app.pilot.cli:main"
nosai-pilot-cycle = "app.pilot.cli:main"
nosai-client-probe = "app.client.live_probe_cli:main"
nosai-diagnostics = "app.diagnostics.cli:main"
nosai-runtime-profile = "app.platform.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
