[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nos-ai-project"
version = "4.21.0"
description = "NosAi full-runtime fusion project"
requires-python = ">=3.10"

[project.optional-dependencies]
m1-learning = ["torch>=2.0"]
rl = [
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.6,<3",
]
vision = [
  "mss>=10,<11",
  "opencv-python>=4.10,<5",
]
ocr = [
  "pytesseract>=0.3.13,<1",
]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "torch>=2.0",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opencv-python>=4.10,<5",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.6,<1",
  "torch>=2.0",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opencv-python>=4.10,<5",
]
dashboard = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
nosai-preflight = "app.preflight:main"
nosai-pilot = "app.pilot.cli:main"
nosai-pilot-cycle = "app.pilot.cli:main"
nosai-client-probe = "app.client.live_probe_cli:main"
nosai-diagnostics = "app.diagnostics.cli:main"
nosai-dashboard = "app.dashboard.cli:main"
nosai-knowledge-import = "app.knowledge.importers.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
