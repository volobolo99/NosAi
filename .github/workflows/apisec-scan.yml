name: APIsec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '42 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apisec-health:
    name: APIsec configuration health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [[ "${{ vars.APISEC_ENABLED }}" == "true" ]]; then
            echo "APIsec is marked enabled. External APIsec execution remains gated until its endpoint and credentials are configured."
          else
            echo "APIsec is not configured; successful no-op health check."
          fi
          echo "APIsec workflow health: OK"
