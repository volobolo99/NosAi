# Optional API security scanning workflow.
# Enable it with repository variable APISEC_ENABLED=true after configuring
# the APIsec credentials and project in GitHub Actions.

name: APIsec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    if: ${{ vars.APISEC_ENABLED == 'true' }}
    permissions:
      security-events: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: APIsec scan
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          sarif-result-file: "apisec-results.sarif"
      - name: Import results
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
        with:
          sarif_file: ./apisec-results.sarif
