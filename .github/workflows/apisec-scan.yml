# Optional API security scanning workflow.
# When APIsec is not configured, the workflow reports a successful no-op
# instead of a skipped workflow, keeping the repository's workflow health green.

name: APIsec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apisec:
    name: APIsec scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Report disabled configuration
        if: ${{ vars.APISEC_ENABLED != 'true' }}
        run: echo "APIsec is not configured; security scan intentionally disabled. Workflow health: OK."

      - name: APIsec scan
        if: ${{ vars.APISEC_ENABLED == 'true' }}
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: ${{ vars.APISEC_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./apisec-results.sarif
