name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'audit/**', 'ci/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python dependency + SAST audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Create isolated security environment
        run: python -m venv .venv
      - name: Install project and security tooling
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install '.[test]'
          .venv/bin/python -m pip install 'pip-audit>=2,<3' 'bandit>=1.7,<2' 'PyYAML>=6,<7'
      - name: Audit installed project dependency closure
        run: .venv/bin/python -m pip_audit
      - name: Run Bandit SAST
        run: .venv/bin/python -m bandit -r app -x tests -ll

  workflow-security:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate workflow permissions and action pinning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          workflow_dir = Path('.github/workflows')
          failures = []
          for path in sorted(workflow_dir.glob('*.yml')) + sorted(workflow_dir.glob('*.yaml')):
              data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              if 'permissions' not in data:
                  failures.append(f'{path}: missing top-level permissions')
              text = path.read_text(encoding='utf-8')
              for match in re.finditer(r'uses:\s*([^\s]+)', text):
                  ref = match.group(1)
                  if '@' not in ref:
                      continue
                  version = ref.rsplit('@', 1)[1]
                  if not re.fullmatch(r'[0-9a-fA-F]{40}', version):
                      failures.append(f'{path}: action is not pinned to a full commit SHA: {ref}')
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('Workflow security policy passed')
          PY
