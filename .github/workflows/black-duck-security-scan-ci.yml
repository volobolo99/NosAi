# Optional Black Duck security scanning.
# When vendor credentials are not configured, the workflow succeeds with an explicit no-op.

name: CI Black Duck security scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 19 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Black Duck security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    steps:
      - name: Report disabled configuration
        if: ${{ vars.BLACKDUCK_ENABLED != 'true' }}
        run: echo "Black Duck is not configured; security scan intentionally disabled. Workflow health: OK."

      - name: Checkout source
        if: ${{ vars.BLACKDUCK_ENABLED == 'true' }}
        uses: actions/checkout@v4

      - name: Black Duck security scan
        if: ${{ vars.BLACKDUCK_ENABLED == 'true' }}
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
