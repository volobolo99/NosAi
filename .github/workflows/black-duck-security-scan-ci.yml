name: CI Black Duck security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 19 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-health:
    name: Black Duck configuration health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [[ "${{ vars.BLACKDUCK_ENABLED }}" == "true" ]]; then
            echo "Black Duck is marked enabled. External vendor scanning remains gated until endpoint and credentials are validated."
          else
            echo "Black Duck is not configured; successful no-op health check."
          fi
          echo "Black Duck workflow health: OK"
