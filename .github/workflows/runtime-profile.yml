name: Runtime profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/runtime-profile.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/runtime-profile.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    name: Deterministic runtime profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile sources
        run: python -m compileall -q app tests tools
      - name: Run deterministic profile
        run: python tools/profile_runtime.py --output runtime_profile.json
      - name: Validate profile artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime_profile.json')
          assert p.is_file() and p.stat().st_size > 0
          data = json.loads(p.read_text(encoding='utf-8'))
          assert 'profile' in data and 'benchmark' in data
          assert data['profile']['levels']
          print('runtime profile artifact: valid')
          PY
      - name: Upload profile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-profile
          path: runtime_profile.json
          if-no-files-found: error
