name: Runtime profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/runtime-profile.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/runtime-profile.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    name: Deterministic runtime profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile sources
        run: python -m compileall -q app tests tools
      - name: Run deterministic profile
        run: python tools/profile_runtime.py --output runtime_profile.json
      - name: Validate profile artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime_profile.json')
          assert p.is_file() and p.stat().st_size > 0
          data = json.loads(p.read_text(encoding='utf-8'))
          assert 'profile' in data and 'benchmark' in data
          assert data['profile']['levels']
          print('runtime profile artifact: valid')
          PY
      - name: Upload profile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-profile
          path: runtime_profile.json
          if-no-files-found: error
