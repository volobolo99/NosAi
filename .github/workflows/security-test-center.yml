name: NosAi Security Evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nosai-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-evidence:
    name: Dependency audit and SBOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Dependency integrity
        id: pip-check
        run: python -m pip check
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Dependency vulnerability audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          python -m pip_audit --format=json --output=pip-audit.json
          audit_exit=$?
          python -m pip_audit --format=cyclonedx-json --output=sbom.cdx.json
          sbom_exit=$?
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit = Path('pip-audit.json')
          vulns = []
          if audit.exists():
              try:
                  data = json.loads(audit.read_text(encoding='utf-8'))
                  for dep in data.get('dependencies', []):
                      for vuln in dep.get('vulns', []):
                          vulns.append({
                              'package': dep.get('name'),
                              'version': dep.get('version'),
                              'id': vuln.get('id'),
                              'fix_versions': vuln.get('fix_versions', []),
                          })
              except (OSError, ValueError, TypeError):
                  vulns = []
          evidence = {
              'schema': 1,
              'status': 'PASS' if not vulns else 'FAIL',
              'pip_check': os.environ.get('PIP_CHECK_OUTCOME', 'unknown'),
              'audit_exit': int(os.environ.get('AUDIT_EXIT', '0')),
              'sbom_exit': int(os.environ.get('SBOM_EXIT', '0')),
              'vulnerability_count': len(vulns),
              'vulnerabilities': vulns,
              'sbom': {'status': 'PASS' if Path('sbom.cdx.json').exists() else 'FAIL', 'format': 'CycloneDX JSON'},
          }
          Path('security-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          PY
          exit 0
        env:
          PIP_CHECK_OUTCOME: ${{ steps.pip-check.outcome }}
          AUDIT_EXIT: ${{ steps.audit.outcome == 'success' && '0' || '1' }}
          SBOM_EXIT: '0'
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: nosai-security-evidence-${{ github.sha }}
          path: |
            security-evidence.json
            pip-audit.json
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce dependency audit gate
        if: steps.audit.outcome == 'failure'
        run: exit 1
