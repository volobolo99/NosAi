name: NosAi Security Evidence

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nosai-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-evidence:
    name: Dependency audit and SBOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Dependency integrity
        id: pip-check
        continue-on-error: true
        run: python -m pip check
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Dependency vulnerability audit and SBOM
        id: audit
        continue-on-error: true
        run: |
          set +e
          python -m pip_audit --format=json --output=pip-audit.json
          audit_exit=$?
          python -m pip_audit --format=cyclonedx-json --output=sbom.cdx.json
          sbom_exit=$?
          export AUDIT_EXIT="$audit_exit" SBOM_EXIT="$sbom_exit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          audit = Path('pip-audit.json')
          vulns = []
          parse_ok = audit.exists()
          if parse_ok:
              try:
                  data = json.loads(audit.read_text(encoding='utf-8'))
                  for dep in data.get('dependencies', []):
                      for vuln in dep.get('vulns', []):
                          vulns.append({
                              'package': dep.get('name'),
                              'version': dep.get('version'),
                              'id': vuln.get('id'),
                              'fix_versions': vuln.get('fix_versions', []),
                          })
              except (OSError, ValueError, TypeError):
                  parse_ok = False
          sbom_exists = Path('sbom.cdx.json').exists()
          pip_check = os.environ.get('PIP_CHECK_OUTCOME', 'unknown')
          audit_exit = int(os.environ.get('AUDIT_EXIT', '1'))
          sbom_exit = int(os.environ.get('SBOM_EXIT', '1'))
          evidence = {
              'schema': 1,
              'status': 'PASS' if pip_check == 'success' and parse_ok and not vulns and sbom_exists else 'FAIL',
              'pip_check': pip_check,
              'audit_exit': audit_exit,
              'sbom_exit': sbom_exit,
              'vulnerability_count': len(vulns),
              'vulnerabilities': vulns,
              'sbom': {'status': 'PASS' if sbom_exists and sbom_exit == 0 else 'FAIL', 'format': 'CycloneDX JSON'},
          }
          Path('security-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          PY
        env:
          PIP_CHECK_OUTCOME: ${{ steps.pip-check.outcome }}
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: nosai-security-evidence-${{ github.sha }}
          path: |
            security-evidence.json
            pip-audit.json
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce dependency audit gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('security-evidence.json').read_text(encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit('Security evidence gate failed')
          PY
