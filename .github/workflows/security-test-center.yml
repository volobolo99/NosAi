name: NosAi Security Evidence

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-evidence:
    name: Dependency audit and SBOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deterministic security environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'pytest>=8,<9' 'ruff>=0.6,<1' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'numpy>=1.26,<3' pip-audit
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Dependency integrity
        id: pip-check
        continue-on-error: true
        run: python -m pip check
      - name: Dependency vulnerability audit and SBOM
        id: audit
        continue-on-error: true
        run: |
          set +e
          python -m pip_audit --format=json --output=pip-audit.json
          audit_exit=$?
          python -m pip_audit --format=cyclonedx-json --output=sbom.cdx.json
          sbom_exit=$?
          export AUDIT_EXIT="$audit_exit" SBOM_EXIT="$sbom_exit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          audit = Path('pip-audit.json')
          vulns = []
          parse_ok = audit.exists()
          if parse_ok:
              try:
                  data = json.loads(audit.read_text(encoding='utf-8'))
                  for dep in data.get('dependencies', []):
                      for vuln in dep.get('vulns', []):
                          vulns.append({'package': dep.get('name'), 'version': dep.get('version'), 'id': vuln.get('id'), 'fix_versions': vuln.get('fix_versions', [])})
              except (OSError, ValueError, TypeError):
                  parse_ok = False
          sbom_exists = Path('sbom.cdx.json').exists()
          pip_check = os.environ.get('PIP_CHECK_OUTCOME', 'unknown')
          audit_exit = int(os.environ.get('AUDIT_EXIT', '1'))
          sbom_exit = int(os.environ.get('SBOM_EXIT', '1'))
          evidence = {'schema': 1, 'status': 'PASS' if pip_check == 'success' and audit_exit == 0 and parse_ok and not vulns and sbom_exists and sbom_exit == 0 else 'FAIL', 'pip_check': pip_check, 'audit_exit': audit_exit, 'sbom_exit': sbom_exit, 'vulnerability_count': len(vulns), 'vulnerabilities': vulns, 'sbom': {'status': 'PASS' if sbom_exists and sbom_exit == 0 else 'FAIL', 'format': 'CycloneDX JSON'}}
          Path('security-evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          PY
        env:
          PIP_CHECK_OUTCOME: ${{ steps.pip-check.outcome }}
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nosai-security-evidence-${{ github.sha }}
          path: |
            security-evidence.json
            pip-audit.json
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency audit gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('security-evidence.json').read_text(encoding='utf-8'))
          if data.get('status') != 'PASS':
              raise SystemExit('Security evidence gate failed')
          PY
