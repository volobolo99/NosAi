name: Release NosAi

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build and attest Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Verify distributions
        run: |
          python -m pip install dist/*.whl
          nosai-preflight --help
      - name: Upload release package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nosai-python-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: 'dist/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
