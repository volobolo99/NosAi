name: Dependency Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency vulnerability and license review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b4f5e0c7a1c7c6f8c9c5e6f2b8d8a1f6c1
        with:
          fail-on-severity: high
