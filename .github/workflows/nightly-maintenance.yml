name: Nightly Maintenance

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Nightly full health check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,test,vision,ocr,rl]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile everything
        run: python -m compileall -q app tests
      - name: Full regression suite
        run: python -m pytest -q --maxfail=1
      - name: AI evaluation suite
        run: python -m pytest -q tests/unit/test_ai_evaluation.py
      - name: Benchmark suite
        run: python -m pytest -q tests/test_hardware_benchmark.py tests/benchmark
