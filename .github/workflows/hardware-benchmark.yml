name: Hardware Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/hardware-benchmark.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/hardware-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Compile sources
        run: python -m compileall -q app tests tools
      - name: Run hardware benchmark
        run: python tools/hardware_benchmark.py --output artifacts/hardware_benchmark.json
      - name: Validate benchmark artifact
        run: python -m pytest -q tests/test_hardware_benchmark.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nosai-hardware-benchmark
          path: artifacts/hardware_benchmark.json
          if-no-files-found: error
