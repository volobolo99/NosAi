name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Run tests with coverage
        run: |
          pytest -q --cov=app --cov-report=xml:coverage.xml

      - name: SonarCloud scan (configured)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v6

      - name: SonarCloud health check (not configured)
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not configured; external SonarCloud analysis is skipped."
          echo "SonarCloud workflow health: OK"
