name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require SonarCloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is required; SonarCloud is a mandatory quality gate."; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install 'pytest==8.4.2' 'pytest-cov==7.1.0' 'numpy==2.3.4' 'torch==2.13.0'
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
          python -m pip install --no-deps .
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=xml:coverage.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
