name: CI

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-migration:
    name: Source-first migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate release archive when needed
        shell: bash
        run: |
          set -euo pipefail
          if test -f .source-migrated; then
            echo 'Source migration already completed.'
            exit 0
          fi
          archive="$(find . -maxdepth 2 -type f -name 'NosAi*.zip' -print -quit)"
          if test -z "$archive"; then
            echo 'No release archive found; nothing to migrate.'
            exit 0
          fi
          rm -rf .source-stage
          mkdir .source-stage
          unzip -q "$archive" -d .source-stage
          find .source-stage -type d -name '__pycache__' -prune -exec rm -rf {} +
          find .source-stage -type f -name '*.pyc' -delete
          test -f .source-stage/setup.py
          test -d .source-stage/app
          test -d .source-stage/tests
          cp -a .source-stage/. ./
          rm -f "$archive"
          rm -rf .source-stage
          touch .source-migrated
          test -f app/m1/world_model/latent.py
          test -f tests/conftest.py
          test -f setup.py
          if find . -type d -name '__pycache__' -not -path './.git/*' | grep -q .; then exit 1; fi
          if find . -type f -name '*.pyc' -not -path './.git/*' | grep -q .; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: migrate NosAi source tree from release archive'
          git push origin HEAD:${GITHUB_REF_NAME}

  baseline-tests:
    name: Baseline regression suite
    needs: source-migration
    if: ${{ always() && needs.source-migration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Select source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if test -f .source-migrated; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            archive="$(find . -maxdepth 2 -type f -name 'NosAi*.zip' -print -quit)"
            test -n "$archive"
            rm -rf .ci-runtime
            mkdir .ci-runtime
            unzip -q "$archive" -d .ci-runtime
            find .ci-runtime -type d -name '__pycache__' -prune -exec rm -rf {} +
            find .ci-runtime -type f -name '*.pyc' -delete
            echo "workdir=.ci-runtime" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deterministic test environment
        shell: bash
        env:
          WORKDIR: ${{ steps.source.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.0'

      - name: Verify runtime dependency
        shell: bash
        env:
          WORKDIR: ${{ steps.source.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python - <<'PY'
          import torch
          import torch.nn as nn
          print(f'torch={torch.__version__}')
          assert nn.Module is not None
          PY

      - name: Compile Python sources
        shell: bash
        env:
          WORKDIR: ${{ steps.source.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python -m compileall -q app tests

      - name: Run regression suite
        shell: bash
        env:
          WORKDIR: ${{ steps.source.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python -m pytest -q
