name: CI

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'feat/**', 'fix/**', 'audit/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -d app
          test -d tests
          test -f app/m1/world_model/latent.py
          test -z "$(find app tests -type d -name '__pycache__' -print -quit)"
          test -z "$(find app tests -type f -name '*.pyc' -print -quit)"

      - name: Install deterministic test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'pytest>=8,<9' 'ruff>=0.6,<1'
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.0'

      - name: Verify runtime dependency
        run: |
          python - <<'PY'
          import torch
          import torch.nn as nn
          print(f"torch={torch.__version__}")
          assert nn.Module is not None
          PY

      - name: Run changed-file Ruff quality gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t changed_py < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'app/**/*.py' 'tests/**/*.py' '*.py')
          if [ "${#changed_py[@]}" -eq 0 ]; then
            echo "No Python files changed; Ruff gate is not applicable."
            exit 0
          fi
          printf 'Linting %s changed Python files:\n' "${#changed_py[@]}"
          printf ' - %s\n' "${changed_py[@]}"
          python -m ruff check "${changed_py[@]}"

      - name: Report repository Ruff baseline (non-blocking)
        shell: bash
        run: |
          set +e
          python -m ruff check app tests
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Repository-wide Ruff debt exists outside the current change set; it is tracked separately from the PR regression gate."
          fi
          exit 0

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Run AI evaluation gate
        run: python -m pytest -q tests/unit/test_ai_evaluation.py
