name: CI

on:
  push:
    branches: [main, develop/nosai-next, 'chore/**', 'feature/**', 'feat/**', 'fix/**', 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Source regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -d app
          test -d tests
          test -f app/m1/world_model/latent.py

      - name: Install deterministic test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'pytest>=8,<9' 'ruff>=0.6,<1' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'numpy>=1.26,<3' 'opencv-python>=4.10,<5'
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Verify runtime dependencies
        run: |
          python - <<'PY'
          import cv2
          import numpy
          import torch
          import torch.nn as nn
          print(f"opencv={cv2.__version__}")
          print(f"numpy={numpy.__version__}")
          print(f"torch={torch.__version__}")
          assert nn.Module is not None
          PY

      - name: Run Ruff quality report
        shell: bash
        run: |
          set +e
          python -m ruff check app/static_data tests/static_data --output-format=github
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Ruff reported advisory findings; the regression gate remains green while these findings are tracked separately."
          fi
          exit 0

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Run AI evaluation gate
        run: python -m pytest -q tests/unit/test_ai_evaluation.py

  openai-smoke:
    name: OpenAI credential + Responses API smoke (simulation only)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOSAI_OPENAI_MODEL: gpt-5.2
      NOSAI_SIMULATION_ONLY: '1'
      NOSAI_LIVE_ACTIONS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install OpenAI smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<9' 'openai>=1,<2'

      - name: Verify secret is present without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo 'OPENAI_API_KEY GitHub Secret is missing'; exit 1; }
          echo 'OPENAI_API_KEY is configured.'

      - name: Run real OpenAI API smoke test
        run: python -m pytest -q tests/integration/test_openai_smoke.py
