name: CI

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'feat/**', 'fix/**', 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Source regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -d app
          test -d tests
          test -f app/m1/world_model/latent.py

      - name: Install deterministic test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'pytest>=8,<9' 'ruff>=0.6,<1' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'numpy>=1.26,<3'
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Verify runtime dependencies
        run: |
          python - <<'PY'
          import numpy
          import torch
          import torch.nn as nn
          print(f"numpy={numpy.__version__}")
          print(f"torch={torch.__version__}")
          assert nn.Module is not None
          PY

      - name: Run Ruff quality report
        shell: bash
        run: |
          set +e
          python -m ruff check app/static_data tests/static_data --output-format=github
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Ruff reported advisory findings; the regression gate remains green while these findings are tracked separately."
          fi
          exit 0

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Run AI evaluation gate
        run: python -m pytest -q tests/unit/test_ai_evaluation.py
