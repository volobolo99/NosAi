name: CI

on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-tests:
    name: Baseline regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Locate release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 2 -type f -name 'NosAi*.zip' -print -quit)"
          test -n "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Extract release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf .ci-runtime
          mkdir .ci-runtime
          unzip -q "$ARCHIVE" -d .ci-runtime
          test -f .ci-runtime/setup.py
          test -d .ci-runtime/app
          test -d .ci-runtime/tests

      - name: Install deterministic test environment
        working-directory: .ci-runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.0'

      - name: Verify runtime dependency
        working-directory: .ci-runtime
        run: |
          python - <<'PY'
          import torch
          import torch.nn as nn
          print(f"torch={torch.__version__}")
          assert nn.Module is not None
          PY

      - name: Compile Python sources
        working-directory: .ci-runtime
        run: python -m compileall -q app tests

      - name: Run regression suite
        working-directory: .ci-runtime
        run: python -m pytest -q
