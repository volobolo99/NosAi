name: Build Nos AI Launcher Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/launcher.py'
      - 'scripts/launch_nosai.py'
      - 'scripts/Avvia_NosAi_Scanner.bat'
      - 'app/diagnostics/**'
      - 'app/client/**'
      - '.github/workflows/build-launcher.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Python sources
        run: |
          python -m compileall -q app scripts
          python -c "import app.launcher; print('launcher import: OK')"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build portable launcher
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Nos AI Launcher Test" --paths . scripts/launch_nosai.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Nos AI Launcher Test.exe')) { throw 'EXE non generato' }
          Get-Item 'dist/Nos AI Launcher Test.exe' | Format-List Name,Length,FullName
      - name: Package launcher
        shell: pwsh
        run: Compress-Archive -Path 'dist/Nos AI Launcher Test.exe' -DestinationPath 'dist/Nos-AI-Launcher-Test.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Nos-AI-Launcher-Test-Windows
          path: dist/Nos-AI-Launcher-Test.zip
