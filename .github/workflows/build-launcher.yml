name: Build Nos AI Launcher Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/launcher.py'
      - 'scripts/launch_nosai.py'
      - 'scripts/Avvia_NosAi_Scanner.bat'
      - 'scripts/e2e_client_scan.py'
      - 'app/diagnostics/**'
      - '.github/workflows/build-launcher.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build portable launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Nos AI Launcher Test" scripts/launch_nosai.py
      - name: Package launcher
        shell: pwsh
        run: Compress-Archive -Path 'dist/Nos AI Launcher Test.exe' -DestinationPath 'dist/Nos-AI-Launcher-Test.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Nos-AI-Launcher-Test-Windows
          path: dist/Nos-AI-Launcher-Test.zip
