name: Build Nos AI Launcher Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate launcher sources
        shell: pwsh
        run: |
          python -m compileall -q app scripts
          if (-not (Test-Path 'scripts/launch_nosai.py')) { throw 'Missing scripts/launch_nosai.py' }
          if (-not (Test-Path 'app/launcher.py')) { throw 'Missing app/launcher.py' }
          python -c "import app.launcher; print('launcher import: OK')"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable launcher
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Nos AI Launcher Test" --paths . scripts/launch_nosai.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'dist/Nos AI Launcher Test.exe'
          if (-not (Test-Path $exe)) { throw "EXE not produced: $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 100000) { throw "EXE is unexpectedly small: $size bytes" }
          Write-Host "EXE verified: $size bytes"

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path 'dist/Nos AI Launcher Test.exe' -DestinationPath 'dist/Nos-AI-Launcher-Test.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nos-AI-Launcher-Test-Windows
          path: dist/Nos-AI-Launcher-Test.zip
          if-no-files-found: error
