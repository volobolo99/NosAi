name: Pyre

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pyre:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Run Pyre
        uses: facebook/pyre-action@12b8d923443ea66cb657facc2e5faac1c8c86e64
        with:
          repo-directory: './'
          requirements-path: 'requirements.txt'
