name: NosAi Quality Gates

on:
  push:
    branches: [main]
    paths-ignore:
      - '.nosai/test-center/latest.json'
  pull_request:

permissions:
  contents: read

concurrency:
  group: nosai-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: L0-L4 quality and regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and development test dependencies
        id: install
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e '.[dev]'
      - name: Dependency integrity
        id: dependency
        run: python -m pip check
      - name: Static checks (advisory)
        id: static
        continue-on-error: true
        run: python -m ruff check app tests
      - name: Import/package smoke test
        id: import
        run: python -c "import app; print('app import OK')"
      - name: Unit, contract and integration regression suite
        id: regression
        run: python -m pytest -q --maxfail=1 --junitxml=test-results.xml --cov=app --cov-report=term-missing --cov-report=xml
      - name: CLI smoke tests
        id: cli
        if: always()
        run: |
          nosai-preflight --help
          nosai-client-probe --help
          nosai-diagnostics --help
          nosai-dashboard --help
          nosai-knowledge-import --help
      - name: Build unified Test Center evidence
        if: always()
        env:
          QUALITY_OUTCOME: ${{ steps.regression.outcome || 'not_run' }}
          STATIC_OUTCOME: ${{ steps.static.outcome || 'not_run' }}
          CLI_OUTCOME: ${{ steps.cli.outcome || 'not_run' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/build_test_center_evidence.py
      - name: Publish Test Center evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nosai-test-center-${{ github.sha }}
          path: |
            test-center-evidence.json
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish regression test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nosai-test-results-${{ github.sha }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  publish-test-center:
    name: Persist Test Center evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, security-evidence]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download Test Center evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nosai-test-center-${{ github.sha }}
          path: .ci-test-center
          if-no-artifact-found: ignore
      - name: Download security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nosai-security-evidence-${{ github.sha }}
          path: .ci-security
          if-no-artifact-found: ignore
      - name: Merge security evidence into Test Center snapshot
        run: |
          set -euo pipefail
          if test -f .ci-test-center/test-center-evidence.json && test -f .ci-security/security-evidence.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          target = Path('.ci-test-center/test-center-evidence.json')
          security = json.loads(Path('.ci-security/security-evidence.json').read_text(encoding='utf-8'))
          data = json.loads(target.read_text(encoding='utf-8'))
          data['security'] = security
          data['sbom'] = security.get('sbom', {'status': 'NOT_RUN'})
          data['schema'] = max(int(data.get('schema', 1)), 3)
          target.write_text(json.dumps(data, indent=2, sort_keys=True), encoding='utf-8')
          PY
          fi
      - name: Persist latest evidence snapshot
        run: |
          set -euo pipefail
          if test -f .ci-test-center/test-center-evidence.json; then
            mkdir -p .nosai/test-center
            cp .ci-test-center/test-center-evidence.json .nosai/test-center/latest.json
          else
            echo 'No Test Center evidence artifact was produced; leaving previous snapshot unchanged.'
          fi
      - name: Commit evidence snapshot
        if: hashFiles('.nosai/test-center/latest.json') != ''
        run: |
          set -euo pipefail
          git config user.name 'NosAi CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nosai/test-center/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(test-center): update latest verification evidence [skip ci]"
          git push

  security-evidence:
    name: Dependency audit and SBOM evidence
    uses: ./.github/workflows/security-test-center.yml

  safety:
    name: Safety boundary gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install development test dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e '.[dev]'
      - name: Observation-only safety tests
        run: python -m pytest -q tests/test_ci_safety_contract.py tests/test_client_adapter.py tests/test_client_probe_runtime.py

  benchmark-smoke:
    name: Benchmark smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b163d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Benchmark smoke tests
        run: python -m pytest -q tests/test_hardware_benchmark.py tests/benchmark
