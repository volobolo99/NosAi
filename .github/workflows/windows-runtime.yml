name: Windows Runtime Validation

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-runtime.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Python runtime smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Compile source tree
        shell: pwsh
        run: python -m compileall -q app tests scripts
      - name: Import critical modules
        shell: pwsh
        run: |
          python -c "import app; import app.launcher; import app.dashboard.server; print('critical imports: OK')"
      - name: CLI smoke tests
        shell: pwsh
        run: |
          nosai-preflight --help
          nosai-client-probe --help
          nosai-diagnostics --help
          nosai-dashboard --help
      - name: Windows regression tests
        shell: pwsh
        run: python -m pytest -q
